<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Établi</title>
<meta name="description" content="Atelier de réparation de montres mécaniques et automatiques : fiches montres, identification de calibre, mesures, huiles, diagnostic.">
<meta name="theme-color" content="#1C2129">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --fond: #F4F1EA;
  --surface: #FFFDF8;
  --surface-2: #EFEBE1;
  --encre: #1C2129;
  --encre-douce: #5D6470;
  --trait: #DDD6C7;
  --laiton: #9A6F22;
  --laiton-fond: #F3E7CC;
  --sur-laiton: #FFFFFF;
  --ok: #2F7A4B;
  --ok-fond: #E1F0E5;
  --attention: #9A6A00;
  --attention-fond: #FBF0D2;
  --alerte: #B3362B;
  --alerte-fond: #F8E1DE;
  --ombre: 0 1px 2px rgba(28,33,41,.06), 0 4px 14px rgba(28,33,41,.06);
  --rayon: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #121519; --surface: #1B1F25; --surface-2: #232830; --encre: #ECE8DF;
    --encre-douce: #A3A9B3; --trait: #2F353E; --laiton: #D6AA55; --laiton-fond: #3A2F1A;
    --sur-laiton: #1B1F25; --ok: #6CC08A; --ok-fond: #1C3326; --attention: #E3B54D;
    --attention-fond: #3A3018; --alerte: #F08A7E; --alerte-fond: #3D2220;
    --ombre: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #121519; --surface: #1B1F25; --surface-2: #232830; --encre: #ECE8DF;
  --encre-douce: #A3A9B3; --trait: #2F353E; --laiton: #D6AA55; --laiton-fond: #3A2F1A;
  --sur-laiton: #1B1F25; --ok: #6CC08A; --ok-fond: #1C3326; --attention: #E3B54D;
  --attention-fond: #3A3018; --alerte: #F08A7E; --alerte-fond: #3D2220;
  --ombre: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--fond); color: var(--encre);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; }
a { color: var(--laiton); }
button, input, select, textarea { font: inherit; color: inherit; }

/* Barre du haut */
.barre {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: var(--fond); border-bottom: 1px solid var(--trait);
}
.barre h1 { font-size: 1.15rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre h1 small { display: block; font-size: .78rem; font-weight: 500; color: var(--encre-douce); }
.icone-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--trait);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none;
}
.icone-btn svg { width: 20px; height: 20px; }

main { max-width: 760px; margin: 0 auto; padding: 16px; }

/* Navigation du bas */
nav.onglets {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--trait);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.onglets button {
  border: 0; background: none; padding: 8px 2px 10px; display: flex; flex-direction: column;
  align-items: center; gap: 3px; font-size: .74rem; color: var(--encre-douce); cursor: pointer;
}
nav.onglets button svg { width: 24px; height: 24px; }
nav.onglets button[aria-current="page"] { color: var(--laiton); font-weight: 600; }

/* Blocs */
.carte {
  background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon);
  padding: 14px; box-shadow: var(--ombre); margin-bottom: 12px;
}
.carte > h3 { margin-bottom: 8px; }
.pile > * + * { margin-top: 10px; }
.ligne { display: flex; align-items: center; gap: 10px; }
.ligne.haut { align-items: flex-start; }
.etire { flex: 1; min-width: 0; }
.doux { color: var(--encre-douce); }
.petit { font-size: .86rem; }
.titre-section { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 8px; }
.titre-section:first-child { margin-top: 0; }
.vide { text-align: center; padding: 28px 12px; color: var(--encre-douce); }
.vide svg { width: 48px; height: 48px; opacity: .5; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--trait);
  background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--encre);
}
.btn.principal { background: var(--laiton); border-color: var(--laiton); color: var(--sur-laiton); }
.btn.danger { color: var(--alerte); }
.btn.plein { width: 100%; }
.btn.petit { min-height: 36px; padding: 0 12px; font-size: .9rem; }
.btn svg { width: 18px; height: 18px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

.liste-item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon);
  padding: 12px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--ombre);
}
.liste-item .vignette {
  width: 56px; height: 56px; border-radius: 10px; flex: none; background: var(--surface-2);
  object-fit: cover; display: grid; place-items: center; color: var(--encre-douce);
}
.liste-item .vignette svg { width: 28px; height: 28px; }
.chevron { width: 18px; height: 18px; color: var(--encre-douce); flex: none; }

.puce {
  display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; font-weight: 600;
  padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--encre-douce);
  white-space: nowrap;
}
.puce.ok { background: var(--ok-fond); color: var(--ok); }
.puce.attention { background: var(--attention-fond); color: var(--attention); }
.puce.alerte { background: var(--alerte-fond); color: var(--alerte); }
.puce.laiton { background: var(--laiton-fond); color: var(--laiton); }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }

/* Formulaires */
label.champ { display: block; margin-bottom: 12px; }
label.champ > span { display: block; font-size: .86rem; font-weight: 600; margin-bottom: 4px; }
label.champ > small { display: block; color: var(--encre-douce); font-size: .8rem; margin-top: 4px; }
input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=search], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--trait); background: var(--surface);
}
textarea { min-height: 88px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--laiton); outline-offset: 1px; }
.grille-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.segment { display: flex; flex-wrap: wrap; gap: 6px; }
.segment label { position: relative; }
.segment input { position: absolute; opacity: 0; pointer-events: none; }
.segment span {
  display: inline-block; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--trait);
  background: var(--surface); cursor: pointer; font-size: .9rem;
}
.segment input:checked + span { background: var(--laiton); border-color: var(--laiton); color: var(--sur-laiton); font-weight: 600; }
.segment input:focus-visible + span { outline: 2px solid var(--laiton); outline-offset: 1px; }

/* Fiche technique */
table.specs { width: 100%; border-collapse: collapse; }
table.specs th, table.specs td { padding: 8px 4px; border-bottom: 1px solid var(--trait); text-align: left; vertical-align: top; }
table.specs th { font-weight: 500; color: var(--encre-douce); width: 46%; }
table.specs tr:last-child th, table.specs tr:last-child td { border-bottom: 0; }
.manque { color: var(--encre-douce); font-style: italic; }

/* Mesures */
.mesures { width: 100%; border-collapse: collapse; table-layout: fixed; }
.mesures th:first-child { width: 31%; }
.mesures td:first-child { white-space: normal !important; overflow-wrap: anywhere; }
.mesures input { min-width: 0; }
.mesures th, .mesures td { padding: 4px 3px; text-align: center; }
.mesures th { font-size: .74rem; color: var(--encre-douce); font-weight: 600; }
.mesures td:first-child { text-align: left; font-size: .84rem; font-weight: 600; white-space: nowrap; }
.mesures input { min-height: 40px; padding: 6px 4px; text-align: center; font-variant-numeric: tabular-nums; }
.analyse { margin-top: 12px; }
.indicateurs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.indicateur { background: var(--surface-2); border-radius: 12px; padding: 10px; }
.indicateur b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.indicateur span { font-size: .78rem; color: var(--encre-douce); }
.message { border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: .92rem; }
.message.ok { background: var(--ok-fond); }
.message.attention { background: var(--attention-fond); }
.message.alerte { background: var(--alerte-fond); }
.message.info { background: var(--laiton-fond); }

/* Photos */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.photos button { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--surface-2); }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .nb { position: absolute; right: 4px; bottom: 4px; }
.ajout-photo { border: 2px dashed var(--trait) !important; background: none !important; color: var(--encre-douce); display: grid; place-items: center; }
.ajout-photo svg { width: 28px; height: 28px; }

.visionneuse { position: relative; border-radius: 12px; overflow: hidden; background: #000; touch-action: manipulation; }
.visionneuse img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.visionneuse.pose { cursor: crosshair; outline: 3px solid var(--laiton); }
.repere {
  position: absolute; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 50%;
  background: var(--laiton); color: var(--sur-laiton); border: 2px solid #fff; font-size: .8rem; font-weight: 700;
  display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.5); cursor: pointer; padding: 0;
}
.repere.actif { background: #fff; color: #000; border-color: var(--laiton); }
.liste-reperes { counter-reset: none; padding: 0; margin: 0; list-style: none; }
.liste-reperes li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--trait); }
.liste-reperes li:last-child { border-bottom: 0; }
.liste-reperes .repere { position: static; transform: none; flex: none; cursor: default; }

/* Accordéons */
details.pli { background: var(--surface); border: 1px solid var(--trait); border-radius: var(--rayon); margin-bottom: 8px; box-shadow: var(--ombre); }
details.pli > summary { list-style: none; padding: 12px 14px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; }
details.pli > summary::-webkit-details-marker { display: none; }
details.pli > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--encre-douce); border-bottom: 2px solid var(--encre-douce); transform: rotate(45deg); transition: transform .15s; }
details.pli[open] > summary::after { transform: rotate(-135deg); }
details.pli > .contenu { padding: 0 14px 14px; }

.cause { padding: 10px 0; border-top: 1px solid var(--trait); }
.cause:first-child { border-top: 0; padding-top: 0; }

.etape { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--trait); cursor: pointer; }
.etape:last-child { border-bottom: 0; }
.etape input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--laiton); }
.etape.faite span { color: var(--encre-douce); text-decoration: line-through; }
.barre-progres { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.barre-progres div { height: 100%; background: var(--laiton); }

.sous-onglets { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px 2px; scrollbar-width: none; }
.sous-onglets button {
  flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--trait); background: var(--surface);
  cursor: pointer; font-size: .9rem; white-space: nowrap;
}
.sous-onglets button[aria-pressed="true"] { background: var(--encre); color: var(--fond); border-color: var(--encre); font-weight: 600; }

.critere { display: flex; align-items: center; gap: 6px; font-size: .84rem; }
.critere i { font-style: normal; width: 16px; text-align: center; font-weight: 700; }
.critere.oui i { color: var(--ok); }
.critere.non i { color: var(--alerte); }
.critere.inconnu i { color: var(--encre-douce); }
.score { font-size: 1.1rem; font-weight: 700; color: var(--laiton); font-variant-numeric: tabular-nums; }

.toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--encre); color: var(--fond); padding: 10px 16px; border-radius: 12px; z-index: 50;
  max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: .92rem;
}
table.huiles { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.huiles td { padding: 8px 4px; border-bottom: 1px solid var(--trait); vertical-align: top; }
table.huiles tr:last-child td { border-bottom: 0; }
table.huiles td:first-child { width: 40%; font-weight: 600; }
.cache { display: none !important; }
@media (min-width: 640px) {
  .photos { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
}
</style>
</head>
<body>
<header class="barre">
  <button class="icone-btn cache" id="btn-retour" aria-label="Retour" data-action="retour">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 id="titre">L'Établi</h1>
  <button class="icone-btn" id="btn-reglages" aria-label="Réglages et sauvegarde" data-action="reglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main id="vue" aria-live="polite"></main>

<nav class="onglets" aria-label="Sections">
  <button data-onglet="montres">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="6"/><path d="M12 9v3l2 1"/><path d="M9 6.5 9.6 2h4.8l.6 4.5M9 17.5l.6 4.5h4.8l.6-4.5"/></svg>
    Mes montres
  </button>
  <button data-onglet="identifier">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><circle cx="11" cy="11" r="2.5"/></svg>
    Identifier
  </button>
  <button data-onglet="calibres">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5"/><path d="M9 4v2M9 12v2M4 9h2M12 9h2"/><circle cx="17" cy="16" r="4"/><path d="M17 12.5v1.5M17 18v1.5M13.5 16H15M19 16h1.5"/></svg>
    Calibres
  </button>
  <button data-onglet="atelier">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L13 18l-3 3-4-4 3-3z"/><path d="M4 20 3 21"/><path d="m5 4 4 4M3 6l2-2"/></svg>
    Atelier
  </button>
</nav>

<input type="file" id="entree-photo" accept="image/*" capture="environment" class="cache">
<input type="file" id="entree-photo-galerie" accept="image/*" multiple class="cache">
<input type="file" id="entree-restauration" accept="application/json,.json" class="cache">

<script src="donnees.js?v=1.1"></script>
<script src="app.js?v=1.1"></script>
</body>
</html>
